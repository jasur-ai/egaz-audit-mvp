# S9 — CI (MVP papkasi alohida repoga chiqarilganda ishlaydi)
name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bog'liqliklar
        run: pip install -r requirements.txt
      - name: Testlar (41 ta) — quvur + baholash + monitoring
        run: pytest -q tests/
      - name: Quvur smoke (kichik hajm)
        run: python3 -c "import sys; sys.path.insert(0,'.'); from src.generator import generate; from src import features as F; import numpy as np; d=generate(n_companies=50, seed=1); X,_=F.feature_matrix(F.build_features(d)); assert np.isfinite(X).all(); print('quvur OK', X.shape)"
